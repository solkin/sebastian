name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check source and release binary vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sebastian-security-check" ./cmd/sebastiand
          govulncheck -mode=binary "$RUNNER_TEMP/sebastian-security-check"

      - name: Run tests
        run: go test -race -count=1 -v -timeout 900s ./...

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build all packages on Windows
        run: go build ./...
