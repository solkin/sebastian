name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check source and release binary vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sebastian-security-check" ./cmd/sebastiand
          govulncheck -mode=binary "$RUNNER_TEMP/sebastian-security-check"

      - name: Run tests
        run: go test -race -count=1 -v -timeout 900s ./...

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all packages on Windows
        run: go build ./...
